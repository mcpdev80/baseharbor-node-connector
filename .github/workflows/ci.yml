name: "CI · Node Connector Quality"

run-name: "CI · Node Connector Quality · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/ci.yml'

concurrency:
  group: connector-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test · Vet · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build connector
        run: go build ./cmd/baseharbor-node-connector
